name: Test and Deploy to Hugging Face

on:
  push:
    branches: [ main, master ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Verify App Entry Point
      run: |
        if [ -f "app.py" ]; then
          echo "✅ app.py 存在，準備部署至 Hugging Face Space！"
        else
          echo "❌ 找不到 app.py！"
          exit 1
        fi

    - name: Push to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git push --force https://user:$HF_TOKEN@huggingface.co/spaces/AndyHSTsao/DoE_HoSungTsao main:main
